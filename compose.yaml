# Dev database. `npm run db` sets the POSTGRES_* variables from .env; a plain
# `docker compose up -d` initializes with the .env.example defaults.
name: anyapp

services:
  postgres:
    image: postgres:17
    container_name: anyapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Seeds the cluster's superuser password on first boot.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-anyapp}
    ports:
      # Loopback only — the dev database must not be reachable from the network.
      # Host port comes from .env via scripts/db.mjs; default 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
      - "[::1]:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # Fixed name so data survives a checkout directory rename.
      - anyapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-anyapp}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  anyapp_pgdata:
    name: anyapp_pgdata
